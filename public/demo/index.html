<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
  <title>GrowthBoard 演示视频 / Demo Video</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f8fafc;
      background: radial-gradient(circle at top, #243b73 0, #10182d 38%, #070b16 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1180px, 100%); }
    header { margin-bottom: 16px; }
    h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 40px); }
    p { margin: 0; color: #aebbd3; }
    video {
      display: block;
      width: 100%;
      max-height: 76vh;
      margin-top: 18px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      background: #000;
      box-shadow: 0 24px 80px rgba(0,0,0,.45);
    }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 10px;
      color: #fff;
      background: rgba(255,255,255,.08);
      text-decoration: none;
    }
    a.primary { border-color: #7c6cff; background: #6657ed; }
    a:hover { background: rgba(255,255,255,.14); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>GrowthBoard 演示视频</h1>
      <p>Demo video · 使用下方播放器观看完整演示</p>
    </header>
    <video controls playsinline preload="metadata" poster="./growth-board-demo-cover.png">
      <source src="./growth-board-demo.mp4" type="video/mp4" />
      当前浏览器不支持 HTML5 视频播放，请使用下方链接打开 MP4 文件。
    </video>
    <nav aria-label="视频操作">
      <a class="primary" href="./growth-board-demo.mp4">直接打开 MP4 / Open MP4</a>
      <a href="../../">返回 GrowthBoard / Back to GrowthBoard</a>
      <a href="https://github.com/wei1305/growth-board">查看仓库 / Repository</a>
    </nav>
  </main>
</body>
</html>
